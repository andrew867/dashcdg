stages:
  - build
  - test

default:
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y make gcc binutils libc6-dev
  cache:
    key:
      files:
        - Makefile
    paths:
      - build/

core_build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE'
  script:
    - make
  artifacts:
    paths:
      - build/bin/test-core
      - build/bin/desktop-tx
      - build/lib/
    expire_in: 1 week

core_test:
  stage: test
  needs:
    - core_build
  rules:
    - if: '$CI_PIPELINE_SOURCE'
  script:
    - make test

desktop_build:
  stage: build
  needs:
    - core_build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - apt-get install -y make gcc binutils libc6-dev libglew-dev freeglut3-dev portaudio19-dev
  script:
    - make desktop-apps
  artifacts:
    paths:
      - build/bin/desktop-player
      - build/bin/desktop-rx
    expire_in: 1 week

# Tranche 1 scaffold: reproducible ESP-IDF build (managed components fetched on first run).
esp32_badge_build:
  stage: build
  image: espressif/idf:release-v5.5
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - platform/espidf/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - platform/espidf/**/*
        - .gitlab-ci.yml
  timeout: 45m
  script:
    - idf.py --version
    - idf.py -C platform/espidf/projects/dashcdg_badge set-target esp32
    - idf.py -C platform/espidf/projects/dashcdg_badge build
  artifacts:
    paths:
      - platform/espidf/projects/dashcdg_badge/build/dashcdg_badge.bin
      - platform/espidf/projects/dashcdg_badge/build/bootloader/bootloader.bin
      - platform/espidf/projects/dashcdg_badge/build/partition_table/partition-table.bin
    expire_in: 1 week
